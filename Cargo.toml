[package]
name = "cdk-blink-payment-processor"
version = "0.1.0"
edition = "2021"
authors = ["asmo <asmogo@protonmail.com>"]
description = "CDK payment processor bridging to Blink GraphQL + WebSocket APIs"
license = "MIT"

[dependencies]
anyhow = "1"
async-trait = "0.1"
cdk-common = { version = "0.17.3", default-features = false, features = ["mint", "grpc"] }
cdk-payment-processor = { version = "0.17.3", default-features = false }
figment = { version = "0.10", features = ["env", "toml"] }
futures-core = "0.3"
futures-util = "0.3"
hex = "0.4"
http = "1"
reqwest = { version = "0.12", features = ["json", "gzip", "brotli", "deflate", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
tokio-stream = "0.1"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
tonic = { version = "0.14", features = ["transport", "tls-ring"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
serial_test = "2"
wiremock = "0.6"
